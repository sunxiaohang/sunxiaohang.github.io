<!doctype html><meta charset="utf-8"><body style="margin:0;background:#999;font:11px sans-serif"><div id="o" style="display:flex;flex-wrap:wrap;gap:5px;padding:5px"></div><script type="module">
import { compileWithImports } from '/src/core/index.js';
import { evaluate } from '/src/core/runtime/evaluate.js';
import { draw } from '/src/render/canvas2d.js';
const q = new URLSearchParams(location.search);
const files = (q.get('f') || '').split(',').filter(Boolean);
const W = +(q.get('w') || 380);
const mode = q.get('mode') || 'poster';
for (const f of files) {
  const src = await (await fetch('/examples/' + f)).text();
  const base = new URL(f, new URL('/examples/', location.href));
  const res = await compileWithImports(src, async (p) => (await fetch(new URL(p, base))).text());
  if (!res.scene) { document.getElementById('o').append(f + ' ERR'); continue; }
  const sc = res.scene;
  let times;
  if (mode === 'poster') times = [sc.steps[Math.min(sc.steps.length - 1, Math.floor(sc.steps.length * 0.7))].freeze];
  else if (mode === 'steps') times = q.get('pick') ? q.get('pick').split(',').map((i) => sc.steps[+i].freeze) : sc.steps.map((s) => s.freeze);
  else { const n = +(q.get('n') || 6); times = Array.from({ length: n }, (_, i) => sc.duration * (i + 0.5) / n); }
  for (const t of times) {
    const c = document.createElement('canvas');
    const k = W / sc.width; c.width = W; c.height = Math.round(sc.height * k);
    draw(c.getContext('2d'), sc, evaluate(sc, t), { pixelRatio: k });
    document.getElementById('o').append(c);
  }
}
document.title = 'ok';
</script>
