<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GridMotion · 用 XML 写几何动画与教程</title>
  <meta name="description" content="用声明式 XML 脚本写几何动画与教学动画：补间、模板、数据驱动，可导出视频/分镜/图片。">
  <meta property="og:title" content="GridMotion · XML 几何动画引擎">
  <meta property="og:description" content="写一份声明式脚本，得到一段可播放、可讲解、可导出的动画教程。">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo"></span><b>GridMotion</b><i>XML 几何动画引擎</i></div>
    <div class="spacer"></div>
    <select id="projects" title="我的场景"></select>
    <button id="btnImport" class="ghost" title="导入 .xml 文件">导入</button>
    <button id="btnExport" class="ghost" title="导出当前场景为 .xml 文件">导出</button>
    <select id="examples" title="示例"></select>
    <select id="palette" title="一键套用配色模板（写入 &lt;scene palette=&quot;…&quot;&gt;）"></select>
    <button id="btnDocs" class="ghost">语法速查</button>
    <button id="btnLibrary" class="ghost">分享库</button>
    <button id="btnAssets" class="ghost">素材</button>
    <button id="btnShare" class="ghost" title="复制当前场景的分享链接">分享</button>
    <button id="btnPng" class="ghost" title="导出当前帧">当前帧</button>
    <button id="btnBoard" class="ghost" title="导出分镜长图">分镜</button>
    <button id="btnWebm" class="primary">导出 WebM</button>
  </header>

  <main>
    <section class="pane editor">
      <div class="pane-title"><span>场景脚本</span><span id="status" class="status"></span></div>
      <div class="code">
        <div class="gutter"><div id="gutter"></div></div>
        <div class="codewrap">
          <div id="hl" aria-hidden="true"></div>
          <textarea id="src" spellcheck="false" wrap="off" autocomplete="off" autocapitalize="off"></textarea>
        </div>
      </div>
      <div id="console" class="console"></div>
    </section>

    <section class="pane right">
      <div class="stagewrap" id="stagewrap">
        <canvas id="stage"></canvas>
        <div id="inspector" class="inspector" hidden>
          <div class="insp-head">
            <span class="insp-title" id="inspTitle">对象</span>
            <button id="inspClose" class="icon" title="取消选中">✕</button>
          </div>
          <div class="insp-body" id="inspBody"></div>
        </div>
      </div>

      <div class="transport">
        <button id="btnPrev" class="icon" title="上一步（←）">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button id="btnPlay" class="icon big" title="播放 / 暂停（空格）"></button>
        <button id="btnNext" class="icon" title="下一步（→）">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        </button>
        <span id="time" class="time">0.00 / 0.00s</span>
        <div class="spacer"></div>
        <button id="btnSound" class="icon" title="音效开/关（M）">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
        </button>
        <label class="chk"><input id="chkGrid" type="checkbox"><span>坐标参考</span></label>
        <label class="chk"><input id="chkLoop" type="checkbox" checked><span>循环</span></label>
        <select id="speed" title="播放速度">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
      </div>

      <div class="lanes" id="lanes">
        <div class="lane ruler-row"><div class="lane-name">时间</div><div class="lane-track" id="ruler"></div></div>
        <div class="lane steps-row"><div class="lane-name">步骤</div><div class="lane-track" id="stepTrack"></div></div>
        <div id="laneRows"></div>
        <div class="overlay"><div class="playhead" id="playhead"></div></div>
      </div>
    </section>
  </main>

  <dialog id="docs">
    <form method="dialog" class="docs-head"><b>语法速查</b><button class="ghost">关闭</button></form>
    <div class="docs-body" id="docsBody"></div>
  </dialog>

  <dialog id="assets">
    <form method="dialog" class="docs-head"><b>素材</b><button class="ghost">关闭</button></form>
    <div class="assets-body" id="assetsBody"></div>
  </dialog>

  <dialog id="library" class="library">
    <form method="dialog" class="docs-head"><b>分享库 · 参考并复制作品</b><button class="ghost">关闭</button></form>
    <div class="library-body" id="libraryBody"></div>
  </dialog>

  <dialog id="welcome" class="welcome">
    <div class="welcome-box">
      <div class="welcome-logo"><span class="logo"></span></div>
      <h1>用 XML 写动画，不是用鼠标画</h1>
      <p class="welcome-sub">声明式脚本 → 一段可播放、可逐步讲解、可导出成视频 / 分镜 / 图片的动画。</p>
      <div class="welcome-features">
        <div><b>声明式</b><span>写「结果」不写「过程」</span></div>
        <div><b>可讲解</b><span>步骤 + 字幕 + 朗读节奏</span></div>
        <div><b>可复用</b><span>模板 / 主题 / 数据驱动</span></div>
      </div>
      <div class="welcome-try">
        <button class="ghost" data-ex="gomoku">看一个完整教程</button>
        <button class="ghost" data-ex="data-demo">数据驱动</button>
        <button class="ghost" data-ex="easing-gallery">缓动效果</button>
      </div>
      <button id="welcomeStart" class="primary wide">开始创作</button>
      <p class="welcome-hint">左上角「示例」随时可看更多；「语法速查」是完整语言参考。</p>
    </div>
  </dialog>

  <script type="module" src="src/app/main.js"></script>
</body>
</html>
